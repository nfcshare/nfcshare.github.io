<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Elis Nascimento</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<style>
/* Layout: perfil de cartão digital em 3 variações azuis (Marinho, Royal, Céu), escolhidas por data-layout */
:root{
  --brand:#1F4E8C; --brand-2:#3E8FD6;
  --bg:#F2F5F9; --surface:#FFFFFF; --ink:#13202E; --muted:#5F6E80; --line:#DEE5EE;
  --btn:#13202E; --btn-ink:#FFFFFF; --tile:#EAF1F9; --on-brand:#FFFFFF;
  --f-display:"Outfit","Avenir Next",system-ui,sans-serif;
  --f-body:"DM Sans",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1119; --surface:#141D29; --ink:#E9EFF6; --muted:#97A6B8; --line:#243244;
  --btn:#E9EFF6; --btn-ink:#0B1119; --tile:#1B2737; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1119; --surface:#141D29; --ink:#E9EFF6; --muted:#97A6B8; --line:#243244;
  --btn:#E9EFF6; --btn-ink:#0B1119; --tile:#1B2737; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.page{max-width:430px;margin:0 auto;display:grid;gap:12px}

/* seletor de opções (só na prévia) */
.picker{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.picker button{font:500 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:999px;padding:7px 14px;cursor:pointer}
.picker button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}

/* base */
.profile{background:var(--surface);border-radius:24px;overflow:hidden;box-shadow:0 1px 2px rgba(19,32,46,.06),0 10px 30px rgba(19,32,46,.07)}
.cover{height:132px;position:relative;
  background:radial-gradient(120% 140% at 100% 0%, var(--brand-2) 0%, transparent 55%),
             linear-gradient(135deg, var(--brand) 0%, #0E2747 100%)}
.cover::after{content:"";position:absolute;inset:0;opacity:.16;
  background-image:repeating-linear-gradient(-35deg, rgba(255,255,255,.55) 0 1px, transparent 1px 14px)}
.who{padding:0 22px 20px;display:grid;justify-items:center;text-align:center;gap:6px}
.avatar{width:104px;height:104px;border-radius:50%;margin-top:-52px;position:relative;z-index:1;
  border:4px solid var(--surface);background:var(--tile);display:grid;place-items:center;overflow:hidden;
  font-family:var(--f-display);font-weight:600;font-size:36px;color:var(--brand)}
.avatar img{width:100%;height:100%;object-fit:cover}
h1{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.1;margin:8px 0 0;letter-spacing:-.01em;text-wrap:balance}
.title{margin:0;color:var(--muted);font-size:15px;max-width:32ch;text-wrap:balance}
.bio{margin:4px 0 0;font-size:15px;max-width:36ch}

.actions{display:grid;gap:8px;padding:0 22px 20px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border-radius:999px;
  font:600 16px/1 var(--f-body);text-decoration:none;cursor:pointer;border:0}
.btn svg{width:20px;height:20px}
.btn-primary{background:var(--btn);color:var(--btn-ink)}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}

.quick{display:flex;justify-content:center;gap:12px;padding:0 22px 24px;flex-wrap:wrap}
.quick a{width:52px;height:52px;border-radius:16px;background:var(--tile);color:var(--brand-2);display:grid;place-items:center}
.quick svg{width:24px;height:24px}

.links{display:grid;gap:8px}
.link{display:grid;grid-template-columns:44px 1fr 20px;align-items:center;gap:14px;background:var(--surface);
  border-radius:18px;padding:12px 16px 12px 12px;color:var(--ink);text-decoration:none;box-shadow:0 1px 2px rgba(19,32,46,.05)}
.link .ic{width:44px;height:44px;border-radius:12px;background:var(--tile);display:grid;place-items:center;color:var(--brand-2)}
.link .ic svg{width:22px;height:22px}
.link b{display:block;font-weight:600}
.link small{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link > span:nth-child(2){min-width:0}
.link .chev{color:var(--muted)}
a:focus-visible,.btn:focus-visible,.picker button:focus-visible{outline:3px solid var(--brand-2);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.link,.btn,.quick a{transition:transform .12s ease}}
.link:active,.btn:active,.quick a:active{transform:scale(.98)}
footer{text-align:center;font-size:12px;color:var(--muted);padding-top:8px}

/* ===== Opção 2 · Royal: cabeçalho inteiro azul, texto branco, alinhado à esquerda ===== */
[data-layout="royal"] .profile{background:linear-gradient(160deg,#2B5BD7 0%,#173B9C 100%);color:var(--on-brand)}
[data-layout="royal"] .cover{display:none}
[data-layout="royal"] .who{justify-items:start;text-align:left;padding:26px 24px 18px}
[data-layout="royal"] .avatar{margin-top:0;width:84px;height:84px;font-size:30px;border:3px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff}
[data-layout="royal"] h1{font-size:30px}
[data-layout="royal"] .title{color:rgba(255,255,255,.78)}
[data-layout="royal"] .actions{padding:0 24px 18px}
[data-layout="royal"] .btn-primary{background:#FFFFFF;color:#173B9C}
[data-layout="royal"] .btn-ghost{color:#fff;border-color:rgba(255,255,255,.4)}
[data-layout="royal"] .quick{justify-content:flex-start;padding:0 24px 24px}
[data-layout="royal"] .quick a{background:rgba(255,255,255,.14);color:#fff}
[data-layout="royal"] .link .ic{color:#2B5BD7}
[data-layout="royal"] a:focus-visible{outline-color:#9CC0FF}

/* ===== Opção 3 · Céu: claro, sem capa, links em grade de blocos ===== */
[data-layout="ceu"]{--tile:#DCEBFB}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) [data-layout="ceu"]{--tile:#1A2C44}}
:root[data-theme="dark"] [data-layout="ceu"]{--tile:#1A2C44}
[data-layout="ceu"] .profile{box-shadow:none;background:transparent;border-radius:0}
[data-layout="ceu"] .cover{display:none}
[data-layout="ceu"] .who{justify-items:start;text-align:left;padding:8px 4px 18px}
[data-layout="ceu"] .avatar{margin-top:0;width:96px;height:96px;border:0;background:var(--tile);color:#2F7FD1}
[data-layout="ceu"] h1{font-size:34px;margin-top:12px}
[data-layout="ceu"] h1::after{content:"";display:block;width:44px;height:4px;border-radius:4px;background:#3E8FD6;margin-top:12px}
[data-layout="ceu"] .actions{padding:0 4px 8px;grid-template-columns:1fr}
[data-layout="ceu"] .btn-primary{background:#2F7FD1;color:#fff}
[data-layout="ceu"] .quick{display:none}
[data-layout="ceu"] .links{grid-template-columns:1fr 1fr}
[data-layout="ceu"] .link{grid-template-columns:1fr;gap:10px;padding:16px;background:var(--tile);box-shadow:none;border-radius:20px}
[data-layout="ceu"] .link .ic{background:var(--surface);color:#2F7FD1}
[data-layout="ceu"] .link .chev{display:none}
[data-layout="ceu"] footer{text-align:left;padding-left:4px}
</style>
</head><body>

<main class="page" id="page">
  <div class="picker" id="picker" hidden><span>Opção:</span></div>
  <section class="profile">
    <div class="cover"></div>
    <div class="who">
      <div class="avatar" id="avatar"></div>
      <h1 id="nome"></h1>
      <p class="title" id="cargo"></p>
      <p class="bio" id="bio"></p>
    </div>
    <div class="actions">
      <a class="btn btn-primary" id="salvar" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-3.9 3.1-7 7-7s7 3.1 7 7"/><path d="M19 8v6M16 11h6"/></svg>
        Salvar contato
      </a>
      <a class="btn btn-ghost" id="trocar" target="_blank" rel="noopener" hidden>Trocar contato</a>
    </div>
    <nav class="quick" id="quick" aria-label="Atalhos"></nav>
  </section>
  <nav class="links" id="links" aria-label="Links"></nav>
  <footer>Aproxime o cartão ou escaneie o QR</footer>
</main>

<script>
/* ===================== EDITE AQUI ===================== */
const P = {
  layout: "royal",         // "marinho", "royal" ou "ceu"
  mostrarOpcoes: false,       // true = mostra os botões de escolher layout (desligue antes de publicar)
  nome: "Elis Nascimento",
  cargo: "",                 // ex: "Gerente de Projetos · Empresa"
  bio: "",                   // uma frase curta (opcional)
  foto: "elisnascimento.jpg", // arquivo na mesma pasta (vazio = iniciais)
  email: "elis_nascimento23@hotmail.com",
  telefone: "+5511986129326",
  empresa: "",
  vcf: "elisnascimento.vcf",
  trocarContato: "",         // link de um Google Forms (vazio = esconde o botão)

  /* MODOS: o que aparece em cada um (use os "tipo" dos links abaixo).
     O link termina com #trabalho ou #pessoal; sem nada, usa o modoPadrao. */
  modoPadrao: "completo",
  modos: {
    completo: null,                                   // null = todos os links
    trabalho: ["linkedin", "email", "whatsapp"],
    pessoal:  ["whatsapp", "telefone", "instagram"],
  },
  links: [
    { tipo:"whatsapp", t:"WhatsApp", s:"+55 11 98612-9326",                        u:"https://wa.me/5511986129326" },
    { tipo:"telefone", t:"Ligar",    s:"+55 11 98612-9326",                        u:"tel:+5511986129326" },
    { tipo:"linkedin", t:"LinkedIn", s:"linkedin.com/in/elis-nascimento-31b77914", u:"https://www.linkedin.com/in/elis-nascimento-31b77914" },
    { tipo:"email",    t:"E-mail",   s:"elis_nascimento23@hotmail.com",           u:"mailto:elis_nascimento23@hotmail.com" },
    // { tipo:"instagram", t:"Instagram", s:"@usuario", u:"https://instagram.com/usuario" },
    // { tipo:"site", t:"Portfólio", s:"meusite.com", u:"https://meusite.com" },
  ],
};
/* ====================================================== */

const I = {
  linkedin:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM3 9.75h4v11H3v-11Zm6.5 0h3.83v1.5h.05c.53-1 1.84-2.05 3.79-2.05 4.05 0 4.8 2.67 4.8 6.13v5.42h-4v-4.8c0-1.15-.02-2.62-1.6-2.62-1.6 0-1.84 1.25-1.84 2.54v4.88h-4v-11Z"/></svg>',
  email:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg>',
  whatsapp:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.6-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 2s.9 2.3 1 2.5c.1.2 1.7 2.6 4.1 3.6 1.5.7 2.1.7 2.9.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2l-.2-.2Z"/></svg>',
  instagram:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>',
  telefone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2Z"/></svg>',
  site:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
  chev:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>'
};
const NOMES = { marinho:"1 · Marinho", royal:"2 · Royal", ceu:"3 · Céu" };

const $ = id => document.getElementById(id);
function setLayout(k){
  $("page").dataset.layout = k;
  document.querySelectorAll(".picker button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.k===k));
  try{ localStorage.setItem("layout", k); }catch(e){}
}
if (P.mostrarOpcoes){
  $("picker").hidden = false;
  Object.entries(NOMES).forEach(([k,v])=>{
    const b=document.createElement("button"); b.type="button"; b.textContent=v; b.dataset.k=k;
    b.onclick=()=>setLayout(k); $("picker").appendChild(b);
  });
}
let start = P.layout;
if (P.mostrarOpcoes){ try{ start = localStorage.getItem("layout") || start; }catch(e){} }
setLayout(start);

$("nome").textContent = P.nome;
$("cargo").textContent = P.cargo; $("cargo").hidden = !P.cargo;
$("bio").textContent = P.bio; $("bio").hidden = !P.bio;
if (P.foto) $("avatar").innerHTML = '<img alt="Foto de '+P.nome+'" src="'+P.foto+'">';
else $("avatar").textContent = P.nome.split(" ").map(w=>w[0]).slice(0,2).join("");

/* Salvar contato: Android abre "Novo contato" preenchido; iPhone usa o .vcf */
if (/Android/i.test(navigator.userAgent)) {
  const e = encodeURIComponent, x = ["S.name="+e(P.nome)];
  if (P.email) x.push("S.email="+e(P.email));
  if (P.telefone) x.push("S.phone="+e(P.telefone));
  if (P.cargo) x.push("S.job_title="+e(P.cargo));
  if (P.empresa) x.push("S.company="+e(P.empresa));
  $("salvar").href = "intent:#Intent;action=android.intent.action.INSERT;type=vnd.android.cursor.dir/raw_contact;"
    + x.join(";") + ";S.browser_fallback_url="+e(new URL(P.vcf, location.href).href)+";end";
} else {
  $("salvar").href = P.vcf;
}
if (P.trocarContato){ $("trocar").href = P.trocarContato; $("trocar").hidden = false; }

/* Modos: o final do link (#trabalho, #pessoal…) escolhe o que aparece */
const MODO_NOMES = { completo:"Completo", trabalho:"Trabalho", pessoal:"Pessoal" };
function render(){
  const h = location.hash.slice(1);
  const m = P.modos[h] ? h : P.modoPadrao;
  const tipos = P.modos[m];
  $("quick").innerHTML = ""; $("links").innerHTML = "";
  document.querySelectorAll("#modos button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.k===m));
  P.links.filter(l => !tipos || tipos.includes(l.tipo)).forEach(addLink);
}
if (P.mostrarOpcoes){
  const box = document.createElement("div"); box.className="picker"; box.id="modos";
  box.innerHTML = "<span>Modo:</span>";
  Object.keys(P.modos).forEach(k=>{
    const b=document.createElement("button"); b.type="button"; b.textContent=MODO_NOMES[k]||k; b.dataset.k=k;
    b.onclick=()=>{ location.hash = k; }; box.appendChild(b);
  });
  $("picker").after(box);
}
addEventListener("hashchange", render);

function addLink(l){
  const q = document.createElement("a");
  q.href = l.u; q.target="_blank"; q.rel="noopener"; q.setAttribute("aria-label", l.t);
  q.innerHTML = I[l.tipo] || I.site; $("quick").appendChild(q);
  const a = document.createElement("a");
  a.className="link"; a.href=l.u; a.target="_blank"; a.rel="noopener";
  a.innerHTML = '<span class="ic">'+(I[l.tipo]||I.site)+'</span><span><b></b><small></small></span><span class="chev">'+I.chev+'</span>';
  a.querySelector("b").textContent = l.t; a.querySelector("small").textContent = l.s;
  $("links").appendChild(a);
}
render();
</script>
</body></html>
